<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-labelledby="t d">
  <title id="t">qq, the question queue for coding agents</title>
  <desc id="d">Two round Q mascots. One raises its hand holding a question bubble; the other holds a stack of question cards. On the right, question cards slide into a queue while the human is away; when the human is back, the top card turns into a green check.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14112B"/>
      <stop offset="1" stop-color="#231B4D"/>
    </linearGradient>
    <linearGradient id="qa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#6D4AFF"/>
    </linearGradient>
    <linearGradient id="qb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <style>
      .ui { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .wave { transform-box: fill-box; transform-origin: 10% 90%; animation: wave 1.4s ease-in-out infinite alternate; }
      .bob { animation: bob 2.4s ease-in-out infinite; }
      .blink { transform-box: fill-box; transform-origin: center; animation: blink 4.6s infinite; }
      .breathe { transform-box: fill-box; transform-origin: 50% 100%; animation: breathe 3.2s ease-in-out infinite; }
      .c1 { animation: in1 8s ease-out infinite; }
      .c2 { animation: in2 8s ease-out infinite; }
      .c3 { animation: in3 8s ease-out infinite; }
      .done { animation: done 8s ease-out infinite; }
      .away { animation: away 8s steps(1) infinite; }
      .back { animation: back 8s steps(1) infinite; }
      @keyframes wave { from { transform: rotate(-8deg); } to { transform: rotate(14deg); } }
      @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
      @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
      @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.025); } }
      @keyframes in1 { 0% { opacity: 0; transform: translateX(60px); } 8%, 100% { opacity: 1; transform: translateX(0); } }
      @keyframes in2 { 0%, 14% { opacity: 0; transform: translateX(60px); } 22%, 100% { opacity: 1; transform: translateX(0); } }
      @keyframes in3 { 0%, 28% { opacity: 0; transform: translateX(60px); } 36%, 100% { opacity: 1; transform: translateX(0); } }
      @keyframes done { 0%, 62% { opacity: 0; } 68%, 94% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes away { 0% { opacity: 1; } 56% { opacity: 0; } 100% { opacity: 1; } }
      @keyframes back { 0% { opacity: 0; } 56% { opacity: 1; } 100% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .wave, .bob, .blink, .breathe, .c1, .c2, .c3 { animation: none; }
        .done, .back { animation: none; opacity: 1; }
        .away { animation: none; opacity: 0; }
      }
    </style>
  </defs>

  <rect width="1200" height="460" rx="28" fill="url(#bg)"/>
  <g opacity="0.5" fill="#fff">
    <circle cx="80" cy="60" r="2"/><circle cx="430" cy="40" r="1.5"/><circle cx="1130" cy="70" r="2"/>
    <circle cx="650" cy="420" r="1.5"/><circle cx="1010" cy="400" r="2"/><circle cx="300" cy="420" r="1.5"/>
  </g>

  <g class="ui">
    <text x="56" y="420" font-size="52" font-weight="900" fill="#fff" letter-spacing="-2">qq</text>
    <text x="128" y="418" font-size="21" fill="#C4B5FD">the question queue for coding agents</text>
  </g>

  <!-- Mascot A: raises its hand with a question -->
  <g transform="translate(150 138)">
    <g class="bob">
      <g transform="translate(190 -120)" filter="url(#soft)">
        <path d="M0 18 Q0 0 18 0 H70 Q88 0 88 18 V50 Q88 68 70 68 H34 L18 84 L20 68 H18 Q0 68 0 50 Z" fill="#fff"/>
        <text x="44" y="51" text-anchor="middle" class="ui" font-size="42" font-weight="800" fill="#6D4AFF">?</text>
      </g>
    </g>
    <g class="wave">
      <path d="M116 40 Q150 10 162 -30" stroke="#8B6BFF" stroke-width="18" stroke-linecap="round" fill="none"/>
      <circle cx="163" cy="-36" r="14" fill="#A78BFA"/>
    </g>
    <g class="breathe">
      <circle cx="70" cy="90" r="82" fill="url(#qa)" filter="url(#soft)"/>
      <path d="M116 140 L160 182" stroke="#5B3BF0" stroke-width="24" stroke-linecap="round" fill="none"/>
      <g class="blink">
        <ellipse cx="44" cy="78" rx="15" ry="19" fill="#fff"/>
        <ellipse cx="96" cy="78" rx="15" ry="19" fill="#fff"/>
        <circle cx="48" cy="82" r="8" fill="#1E1B3A"/>
        <circle cx="100" cy="82" r="8" fill="#1E1B3A"/>
        <circle cx="51" cy="78" r="2.6" fill="#fff"/>
        <circle cx="103" cy="78" r="2.6" fill="#fff"/>
      </g>
      <ellipse cx="28" cy="108" rx="10" ry="6" fill="#F9A8D4" opacity="0.7"/>
      <ellipse cx="112" cy="108" rx="10" ry="6" fill="#F9A8D4" opacity="0.7"/>
      <path d="M58 116 Q70 128 82 116" stroke="#1E1B3A" stroke-width="5" stroke-linecap="round" fill="none"/>
    </g>
  </g>

  <!-- Mascot B: holds the cards -->
  <g transform="translate(372 208)">
    <g class="breathe" style="animation-delay:-1.4s">
      <circle cx="60" cy="72" r="64" fill="url(#qb)" filter="url(#soft)"/>
      <path d="M88 104 L124 140" stroke="#0D9488" stroke-width="19" stroke-linecap="round" fill="none"/>
      <g class="blink" style="animation-delay:-2s">
        <ellipse cx="40" cy="62" rx="12" ry="15" fill="#fff"/>
        <ellipse cx="80" cy="62" rx="12" ry="15" fill="#fff"/>
        <circle cx="43" cy="65" r="6.5" fill="#0F2E2A"/>
        <circle cx="83" cy="65" r="6.5" fill="#0F2E2A"/>
      </g>
      <path d="M50 92 Q60 101 70 92" stroke="#0F2E2A" stroke-width="4.5" stroke-linecap="round" fill="none"/>
      <g transform="translate(-34 70) rotate(-12)">
        <rect x="0" y="0" width="46" height="58" rx="7" fill="#fff" opacity="0.6"/>
        <rect x="6" y="-6" width="46" height="58" rx="7" fill="#fff"/>
        <rect x="14" y="8" width="30" height="5" rx="2.5" fill="#14B8A6"/>
        <rect x="14" y="19" width="24" height="4" rx="2" fill="#CBD5E1"/>
        <rect x="14" y="28" width="28" height="4" rx="2" fill="#CBD5E1"/>
      </g>
    </g>
  </g>

  <!-- Status: the human is away, then back -->
  <g transform="translate(640 58)" class="ui">
    <g class="away">
      <rect width="250" height="44" rx="22" fill="#2E2660"/>
      <circle cx="26" cy="22" r="9" fill="#FDE68A"/><circle cx="31" cy="18" r="8" fill="#2E2660"/>
      <text x="48" y="29" font-size="20" fill="#C4B5FD">you: away, cards wait</text>
    </g>
    <g class="back">
      <rect width="250" height="44" rx="22" fill="#134E4A"/>
      <circle cx="26" cy="22" r="9" fill="#FCD34D"/>
      <text x="48" y="29" font-size="20" fill="#99F6E4">you: back, asked once</text>
    </g>
  </g>

  <!-- The queue -->
  <g class="ui" filter="url(#soft)">
    <g transform="translate(640 122)"><g class="c1">
      <rect width="500" height="80" rx="16" fill="#FFFFFF"/>
      <rect x="18" y="18" width="92" height="28" rx="8" fill="#EDE9FE"/>
      <text x="64" y="38" text-anchor="middle" class="mono" font-size="17" font-weight="700" fill="#6D4AFF">Q0007</text>
      <text x="126" y="39" font-size="21" font-weight="700" fill="#1E1B3A">Move CSV export to Pro?</text>
      <text x="126" y="64" font-size="17" fill="#64748B">today · example · 3 options · recommended</text>
    </g></g>
    <g transform="translate(640 216)"><g class="c2">
      <rect width="500" height="80" rx="16" fill="#FFFFFF"/>
      <rect x="18" y="18" width="92" height="28" rx="8" fill="#CCFBF1"/>
      <text x="64" y="38" text-anchor="middle" class="mono" font-size="17" font-weight="700" fill="#0F766E">Q0008</text>
      <text x="126" y="39" font-size="21" font-weight="700" fill="#1E1B3A">Pay for faster CI builds?</text>
      <text x="126" y="64" font-size="17" fill="#64748B">from another session · claimed once</text>
    </g></g>
    <g transform="translate(640 310)"><g class="c3">
      <rect width="500" height="80" rx="16" fill="#FFFFFF"/>
      <rect x="18" y="18" width="92" height="28" rx="8" fill="#FEF3C7"/>
      <text x="64" y="38" text-anchor="middle" class="mono" font-size="17" font-weight="700" fill="#B45309">Q0009</text>
      <text x="126" y="39" font-size="21" font-weight="700" fill="#1E1B3A">Publish the beta to users?</text>
      <text x="126" y="64" font-size="17" fill="#64748B">Other: write your own answer</text>
    </g></g>
    <g transform="translate(640 122)"><g class="done">
      <rect width="500" height="80" rx="16" fill="#ECFDF5" stroke="#10B981" stroke-width="3"/>
      <circle cx="46" cy="40" r="20" fill="#10B981"/>
      <path d="M36 40 l7 8 l14 -16" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="80" y="39" font-size="21" font-weight="700" fill="#065F46">Answered: "1, but keep it for tiny teams"</text>
      <text x="80" y="64" font-size="17" fill="#047857">recorded word for word · agent studies it</text>
    </g></g>
  </g>
</svg>
